{% extends "base.html" %}

{% block content %}
<!-- Full Edge-to-Edge Hero Carousel -->
<section class="hero-carousel-section full-width-hero">
    <div class="carousel-viewport" id="heroCarousel">
        <div class="carousel-track" id="carouselTrack">
            {% for slide in slides %}
            <div class="slide-frame">
                <img src="{{ url_for('static', filename=slide.image) }}" alt="{{ slide.title }}">
            </div>
            {% endfor %}
        </div>
    </div>
</section>

<!-- Trending Styles Section -->
<section class="products-section">
    <div class="section-title">
        <h2>Trending Styles</h2>
    </div>
    
    {% if items %}
    <div class="product-grid" id="trending-grid"></div>
    {% else %}
    <p class="no-results">No styles found matching your search.</p>
    {% endif %}
</section>

<!-- Full Image Preview Modal -->
<div id="imagePreviewModal" class="image-modal" onclick="closeImagePreview()">
    <span class="close-modal">&times;</span>
    <img class="modal-content-img" id="previewImageTarget">
    <div id="modalCaption"></div>
</div>

<script>
    // Hero Slider Animation
    const track = document.getElementById('carouselTrack');
    const slides = track ? track.children : [];
    let slideIndex = 0;

    if (slides.length > 0) {
        setInterval(() => {
            slideIndex = (slideIndex + 1) % slides.length;
            track.style.transform = `translateX(-${slideIndex * 100}%)`;
        }, 3000);
    }

    // Dynamic Trending Grid Setup
    const collectionItems = {{ items|tojson }};
    const whatsappNumber = "2348134984539"; 

    function renderTrendingItems(startIndex) {
        const grid = document.getElementById('trending-grid');
        if (!grid || collectionItems.length === 0) return;
        
        grid.innerHTML = '';
        const count = Math.min(4, collectionItems.length);
        
        for (let i = 0; i < count; i++) {
            const item = collectionItems[(startIndex + i) % collectionItems.length];
            const message = encodeURIComponent(`Hello House of Rayoor, I am interested in ordering: ${item.title} (${item.price}).`);
            const waUrl = `https://wa.me/${whatsappNumber}?text=${message}`;
            const imgPath = `/static/${item.image}`;

            grid.innerHTML += `
                <div class="product-card">
                    <div class="product-img-wrapper" onclick="openImagePreview('${imgPath}', '${item.title}')">
                        <img src="${imgPath}" alt="${item.title}">
                        <button class="wishlist-btn" onclick="toggleWishlist(event, this)" title="Add to Wishlist">
                            <i class="far fa-heart"></i>
                        </button>
                    </div>
                    <div class="product-details">
                        <p class="product-category">${item.category}</p>
                        <h3 class="product-title" onclick="openImagePreview('${imgPath}', '${item.title}')">${item.title}</h3>
                        <a href="${waUrl}" target="_blank" class="price-wa-link" title="Order via WhatsApp">
                            <p class="product-price">${item.price} <i class="fab fa-whatsapp wa-price-icon"></i></p>
                        </a>
                    </div>
                </div>
            `;
        }
    }

    let currentIndex = 0;
    renderTrendingItems(currentIndex);

    if (collectionItems.length > 4) {
        setInterval(() => {
            currentIndex = (currentIndex + 4) % collectionItems.length;
            renderTrendingItems(currentIndex);
        }, 4000);
    }

    // Modal Controls
    function openImagePreview(src, alt) {
        const modal = document.getElementById("imagePreviewModal");
        const modalImg = document.getElementById("previewImageTarget");
        const caption = document.getElementById("modalCaption");
        modal.style.display = "flex";
        modalImg.src = src;
        caption.innerHTML = alt;
    }

    function closeImagePreview() {
        document.getElementById("imagePreviewModal").style.display = "none";
    }

    function toggleWishlist(event, element) {
        event.stopPropagation();
        const icon = element.querySelector('i');
        if (icon.classList.contains('far')) {
            icon.classList.remove('far');
            icon.classList.add('fas');
            icon.style.color = '#e63946';
        } else {
            icon.classList.remove('fas');
            icon.classList.add('far');
            icon.style.color = '';
        }
    }
</script>
{% endblock %}
