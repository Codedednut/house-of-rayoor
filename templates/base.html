<header class="main-header">
    <div class="header-container">
        <!-- Brand Logo / Title -->
        <a href="{{ url_for('index') }}" class="brand-logo">HOUSE OF RAYOOR</a>

        <!-- Mobile Hamburger Toggle Button -->
        <button class="hamburger-toggle" id="hamburgerBtn" aria-label="Toggle navigation menu">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </button>

        <!-- Navigation Links -->
        <nav class="nav-menu" id="navMenu">
            <a href="{{ url_for('index') }}" class="nav-link">Home</a>
            <a href="{{ url_for('collection') }}" class="nav-link">Collection</a>
            <a href="{{ url_for('bespoke') }}" class="nav-link">Bespoke</a>
            <a href="{{ url_for('contact') }}" class="nav-link">Contact</a>
        </nav>
    </div>
</header>

<!-- JavaScript for Mobile Menu Toggle -->
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const hamburgerBtn = document.getElementById('hamburgerBtn');
        const navMenu = document.getElementById('navMenu');

        if (hamburgerBtn && navMenu) {
            hamburgerBtn.addEventListener('click', function() {
                hamburgerBtn.classList.toggle('active');
                navMenu.classList.toggle('active');
            });

            // Close menu when clicking outside
            document.addEventListener('click', function(e) {
                if (!hamburgerBtn.contains(e.target) && !navMenu.contains(e.target)) {
                    hamburgerBtn.classList.remove('active');
                    navMenu.classList.remove('active');
                }
            });
        }
    });
</script>
