<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}House of Rayoor{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

  <!-- Main Header -->
  <header class="main-header">
    <div class="header-container">
      <div class="brand-logo">
        <a href="{{ url_for('index') }}">HOUSE OF RAYOOR</a>
        <span class="tagline">LUXURY & ELEGANCE</span>
      </div>

      <!-- Mobile 3-Line Hamburger Toggle Button -->
      <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">
        &#9776;
      </button>

      <!-- Main Navigation Links -->
      <nav class="nav-links" id="navMenu">
        <a href="{{ url_for('index') }}">HOME</a>
        <a href="{{ url_for('collection') }}">COLLECTION</a>
        <a href="{{ url_for('bespoke') }}">BESPOKE</a>
        <a href="{{ url_for('contact') }}">CONTACT</a>
      </nav>
    </div>
  </header>

  <!-- Secondary Category Bar -->
  <nav class="category-bar">
    <a href="{{ url_for('collection') }}">NEW IN</a>
    <a href="{{ url_for('collection', q='Ankara') }}">ANKARA WEAR</a>
    <a href="{{ url_for('collection', q='Dresses') }}">DRESSES & GOWNS</a>
    <a href="{{ url_for('collection', q='Agbada') }}">AGBADA & SETS</a>
    <a href="{{ url_for('collection', q='Kaftans') }}">KAFTANS</a>
    <a href="{{ url_for('bespoke') }}">BESPOKE</a>
    <a href="{{ url_for('collection') }}">GALLERY</a>
    <a href="{{ url_for('contact') }}">CONTACT US</a>
  </nav>

  <!-- Dynamic Main Content -->
  <main>
    {% block content %}{% endblock %}
  </main>

  <!-- Footer -->
  <footer class="main-footer">
    <div class="footer-bottom">
      &copy; 2026 House of Rayoor. All rights reserved.
    </div>
  </footer>

  <!-- Mobile Menu Toggle Script -->
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const navToggle = document.getElementById('navToggle');
      const navMenu = document.getElementById('navMenu');

      if (navToggle && navMenu) {
        navToggle.addEventListener('click', function () {
          navMenu.classList.toggle('active');
        });
      }
    });
  </script>

</body>
</html>
